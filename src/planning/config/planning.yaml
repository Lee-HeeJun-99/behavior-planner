planning_node:
  ros__parameters:
    # map
    global_path_file: map/map_final_0921/0-0.txt

    # runtime
    constant_cruise_velocity: 2.5
    planning_period_ms: 50

    # path generation
    lateral_offsets: [-1.2, -0.9, -0.6, -0.3, 0.0, 0.3, 0.6, 0.9, 1.2]
    transition_points: 120
    road_left_bound: 1.5
    road_right_bound: 1.5

    # vehicle and collision
    vehicle_half_width: 0.6
    vehicle_front: 1.6
    vehicle_rear: 0.7
    safety_margin: 0.25
    maximum_curvature: 0.45

    # behavior
    detection_confirmation_count: 3
    clear_confirmation_count: 5
    minimum_behavior_duration_ms: 500

    # stop
    stop_hold_duration_ms: 2000
    # Add `stop_points: [x0, y0, x1, y1, ...]` after the deployed map survey.
    # ROS 2 Humble cannot infer the type of an empty YAML array, so the unset default is empty.

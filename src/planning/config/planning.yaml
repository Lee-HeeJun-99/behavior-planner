planning_node:
  ros__parameters:
    # map
    global_path_file: map/map_final_0921/0-0.txt

    # runtime
    planning_period_ms: 50

    # speed-limit signs and vehicle target mapping
    default_speed_limit_kph: 30
    speed_sign_confirmation_count: 3
    speed_limit_30_target: 2.5
    speed_limit_40_target: 3.5
    speed_limit_50_target: 4.5
    avoid_max_velocity: 2.5

    # path generation
    lateral_offsets: [-1.2, -0.9, -0.6, -0.3, 0.0, 0.3, 0.6, 0.9, 1.2]
    transition_points: 120
    road_left_bound: 1.5
    road_right_bound: 1.5

    # vehicle and collision
    vehicle_half_width: 0.6
    vehicle_front: 1.6
    vehicle_rear: 0.7
    safety_margin: 0.25
    maximum_curvature: 0.45

    # behavior
    detection_confirmation_count: 3
    clear_confirmation_count: 5
    minimum_behavior_duration_ms: 500
